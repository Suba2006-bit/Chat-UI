<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat UI — Social Media Style</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div class="h-screen flex">

  <aside class="w-72 bg-white shadow-lg border-r">
    <div class="p-4 text-xl font-bold text-purple-600">
      Chat App
    </div>

    <div class="px-3 mt-2 text-gray-500 text-sm">Contacts</div>

    <div class="mt-2">

      <div class="flex items-center gap-3 p-3 hover:bg-purple-50 cursor-pointer">
        <div class="w-10 h-10 bg-purple-200 rounded-full"></div>
        <div>
          <p class="font-semibold">Aarav</p>
          <p class="text-xs text-gray-500">Online</p>
        </div>
      </div>

      <div class="flex items-center gap-3 p-3 hover:bg-purple-50 cursor-pointer">
        <div class="w-10 h-10 bg-blue-200 rounded-full"></div>
        <div>
          <p class="font-semibold">Priya</p>
          <p class="text-xs text-gray-500">Typing…</p>
        </div>
      </div>

      <div class="flex items-center gap-3 p-3 hover:bg-purple-50 cursor-pointer">
        <div class="w-10 h-10 bg-green-200 rounded-full"></div>
        <div>
          <p class="font-semibold">Sabi</p>
          <p class="text-xs text-gray-500">Last seen 2h ago</p>
        </div>
      </div>

    </div>
  </aside>


  <main class="flex-1 flex flex-col">

    <header class="bg-white p-4 shadow flex items-center gap-3">
      <div class="w-10 h-10 bg-purple-300 rounded-full"></div>

      <div>
        <p class="font-semibold">Aarav</p>
        <p class="text-xs text-gray-500">Online</p>
      </div>
    </header>


    <div class="flex-1 p-6 overflow-y-auto space-y-4">

      <div class="flex items-start gap-3">
        <div class="w-8 h-8 bg-purple-300 rounded-full"></div>

        <div class="bg-white px-4 py-2 rounded-2xl shadow">
          <p>Hey! How are you?</p>
          <span class="text-xs text-gray-400">10:30 AM</span>
        </div>
      </div>

      <div class="flex justify-end">
        <div class="bg-purple-600 text-white px-4 py-2 rounded-2xl shadow max-w-sm">
          I'm good! How are you?
          <div class="text-xs text-purple-200 text-right">10:31 AM</div>
        </div>
      </div>

      <div class="flex items-start gap-3">
        <div class="w-8 h-8 bg-purple-300 rounded-full"></div>

        <div class="bg-white px-4 py-2 rounded-2xl shadow">
          <p>I'm fine! what about your works?</p>
          <span class="text-xs text-gray-400">10:33 AM</span>
        </div>
      </div>

    </div>


    <div class="p-4 bg-white border-t flex items-center gap-3">

      <input
        type="text"
        placeholder="Type a message..."
        class="flex-1 px-4 py-2 rounded-full border focus:outline-none focus:ring-2 focus:ring-purple-300"
      />

      <button class="px-4 py-2 rounded-full bg-purple-600 text-white hover:bg-purple-700">
        Send
      </button>

    </div>

  </main>

</div>

</body>
</html>
